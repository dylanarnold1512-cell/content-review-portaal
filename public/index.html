<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Review Portaal — Advertisr.</title>
<link rel="icon" href="https://advertisr.nl/wp-content/uploads/2025/03/Logo_Advertisr_new_2025.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <img class="brand-logo" src="https://advertisr.nl/wp-content/uploads/2025/03/Logo_Advertisr_new_2025.svg" alt="Advertisr.">
    <h1>Content Review Portaal</h1>
    <p class="login-sub">Log in om de contentplanning te bekijken.</p>
    <div id="presetClientBadge" class="preset-badge hidden"></div>
    <form id="loginForm">
      <div id="clientSelectGroup">
        <label for="clientSelect">Klant</label>
        <select id="clientSelect" required></select>
      </div>
      <label for="passwordInput">Wachtwoord</label>
      <input id="passwordInput" type="password" required autocomplete="current-password">
      <button type="submit">Inloggen</button>
      <p id="loginError" class="login-error"></p>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="top">
    <div class="top-left">
      <img class="brand-logo-small" src="https://advertisr.nl/wp-content/uploads/2025/03/Logo_Advertisr_new_2025.svg" alt="Advertisr.">
      <div class="top-divider"></div>
      <div>
        <div class="top-title" id="clientName">—</div>
        <div class="top-sub">Contentreview, gekoppeld aan Notion</div>
      </div>
    </div>
    <button id="logoutBtn" class="btn-plain">Uitloggen</button>
  </div>

  <div class="layout">
    <div>
      <div class="col-title" id="listTitle">Blogs</div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </div>
    <div class="detail" id="detail"></div>
  </div>
</div>

<div id="annotationPopover" class="annotation-popover hidden">
  <textarea id="annotationPopoverText" placeholder="Wat moet hier aangepast worden?"></textarea>
  <div class="annotation-popover-actions">
    <button type="button" id="annotationPopoverCancel" class="btn-plain-sm">Annuleren</button>
    <button type="button" id="annotationPopoverSave" class="btn-save-sm">Opmerking opslaan</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
